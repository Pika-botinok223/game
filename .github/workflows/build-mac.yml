name: Build macOS DMG

on:
  push:
    branches: ['claude/**', 'main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  web-build:
    name: Web build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  dmg:
    name: DMG (macos-latest)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build DMGs (x64 then arm64, sequential to avoid hdiutil volume clash; unsigned)
        run: npm run dist:mac
      - name: List release output
        run: ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: ave-maria-mac-dmg
          path: release/*.dmg
          if-no-files-found: error
      - name: Attach DMGs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Ave Maria ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*.dmg
          generate_release_notes: true
